# ============================================================
# Gridder - Traefik Dynamic Configuration
# ============================================================
# This file contains dynamic configuration for Traefik
# Static configuration is in docker-compose.prod.yml command section
# ============================================================

# ============================================================
# HTTP Configuration
# ============================================================
http:
  # Middlewares
  middlewares:
    # Security headers
    secure-headers:
      headers:
        # Prevent clickjacking
        frameDeny: true
        # XSS Protection
        browserXssFilter: true
        # Content Type sniffing protection
        contentTypeNosniff: true
        # HSTS (HTTP Strict Transport Security)
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        # Referrer Policy
        referrerPolicy: "strict-origin-when-cross-origin"
        # Custom headers
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    # Compression
    compress:
      compress: {}

    # WebSocket support
    websocket-headers:
      headers:
        customRequestHeaders:
          Connection: "Upgrade"
          Upgrade: "websocket"

  # Routers (additional routing rules)
  routers:
    # Health check endpoint (no auth required)
    health-check:
      rule: "PathPrefix(`/health`)"
      entrypoints:
        - websecure
      service: backend
      tls:
        certResolver: letsencrypt

# ============================================================
# TLS Configuration
# ============================================================
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
