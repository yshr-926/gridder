# ============================================================
# Gridder - Rust Backend CI Pipeline
# ============================================================
# This workflow handles Rust-specific checks:
# - Security audit (cargo-audit)
# - MSRV (Minimum Supported Rust Version) check
# - Documentation build
# - Benchmarks (on main branch only)
# ============================================================

name: Rust

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/backend/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92"

jobs:
  # ============================================
  # Security Audit
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # sqlx pulls rsa via optional sqlx-mysql; not used in this project (Postgres-only)
          ignore: RUSTSEC-2023-0071
          working-directory: apps/backend

  # ============================================
  # MSRV Check
  # ============================================
  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/backend/target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('apps/backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
            ${{ runner.os }}-cargo-

      - name: Check MSRV
        working-directory: apps/backend
        run: cargo check --all-features

  # ============================================
  # Documentation
  # ============================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/backend/target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('apps/backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-
            ${{ runner.os }}-cargo-

      - name: Build documentation
        working-directory: apps/backend
        env:
          # Allow broken doc links from dependencies, but warn (not error)
          RUSTDOCFLAGS: -W rustdoc::broken_intra_doc_links -W rustdoc::invalid_html_tags
        run: cargo doc --no-deps --all-features

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: rust-docs
          path: apps/backend/target/doc/
          retention-days: 7

  # ============================================
  # Integration Tests with Services
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gridder
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gridder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/backend/target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('apps/backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-
            ${{ runner.os }}-cargo-

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres || true

      - name: Run migrations
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://gridder:test_password@localhost:5432/gridder_test
        run: |
          if [ -d "migrations" ] && [ "$(ls -A migrations)" ]; then
            sqlx migrate run || echo "No migrations to run"
          fi

      - name: Run integration tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://gridder:test_password@localhost:5432/gridder_test
          TEST_DATABASE_URL: postgres://gridder:test_password@localhost:5432/gridder_test
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1
        run: |
          # Run persistence tests (DB-dependent)
          cargo test --test persistence_test -- --ignored
          # Skip pubsub_integration tests for now (requires fix in Redis Pub/Sub implementation)

  # ============================================
  # Benchmark (main branch only)
  # ============================================
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/backend/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('apps/backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: Run benchmarks
        working-directory: apps/backend
        run: cargo bench --no-run || echo "No benchmarks found"

  # ============================================
  # Coverage Report
  # ============================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gridder
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gridder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/backend/target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('apps/backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://gridder:test_password@localhost:5432/gridder_test
          TEST_DATABASE_URL: postgres://gridder:test_password@localhost:5432/gridder_test
          REDIS_URL: redis://localhost:6379
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/backend/lcov.info
          flags: backend-rust
          fail_ci_if_error: false
