name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for E2E tests
        run: pnpm turbo run build --filter=@gridder/web

      - name: Install Playwright Browsers
        run: |
          # Install the target browser for tests
          pnpm --filter @gridder/web exec playwright install --with-deps ${{ matrix.browser }}
          # Also install chromium for global-setup.ts server verification
          if [ "${{ matrix.browser }}" != "chromium" ]; then
            pnpm --filter @gridder/web exec playwright install --with-deps chromium
          fi

      - name: Run E2E tests
        run: pnpm --filter @gridder/web exec playwright test --project=${{ matrix.browser }} --grep-invert "Visual Regression"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  edge:
    name: E2E Tests (Edge)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for E2E tests
        run: pnpm turbo run build --filter=@gridder/web

      - name: Install Playwright
        run: pnpm --filter @gridder/web exec playwright install --with-deps

      - name: Run E2E tests on Edge
        run: pnpm --filter @gridder/web exec playwright test --project=edge --grep-invert "Visual Regression"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-edge
          path: playwright-report/
          retention-days: 7

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-edge
          path: test-results/
          retention-days: 7
