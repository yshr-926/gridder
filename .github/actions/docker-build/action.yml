# ============================================================
# Gridder - Docker Build Composite Action
# ============================================================
# This action builds and optionally pushes Docker images
# with caching support.
# ============================================================

name: Docker Build
description: Build Docker images with caching

inputs:
  image-name:
    description: Name of the Docker image
    required: true
  context:
    description: Docker build context
    required: false
    default: "."
  dockerfile:
    description: Path to Dockerfile
    required: true
  push:
    description: Whether to push the image
    required: false
    default: "false"
  build-args:
    description: Build arguments (newline-separated)
    required: false
    default: ""
  tags:
    description: Image tags (newline-separated)
    required: false
    default: ""

outputs:
  image-id:
    description: The built image ID
    value: ${{ steps.build.outputs.imageid }}
  digest:
    description: The image digest
    value: ${{ steps.build.outputs.digest }}
  metadata:
    description: The image metadata
    value: ${{ steps.build.outputs.metadata }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Display build info
      shell: bash
      run: |
        echo "Image built successfully"
        echo "Image ID: ${{ steps.build.outputs.imageid }}"
        if [ -n "${{ steps.build.outputs.digest }}" ]; then
          echo "Digest: ${{ steps.build.outputs.digest }}"
        fi
