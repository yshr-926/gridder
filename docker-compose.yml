# Gridder Docker Compose Configuration
services:
  gridder:
    build:
      context: .
      dockerfile: Dockerfile
    image: gridder:latest
    container_name: gridder
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
