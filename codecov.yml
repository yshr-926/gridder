# Codecov 設定
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 2%

comment:
  layout: "header, diff, flags, components, footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

github_checks:
  annotations: true
